name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zeekrbass.jks"
            echo "ZEEKRBASS_KEYSTORE=$RUNNER_TEMP/zeekrbass.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set, so this build uses a throwaway debug key."
          fi

      - name: Build release APK
        env:
          ZEEKRBASS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ZEEKRBASS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ZEEKRBASS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ZeekrBass.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZeekrBass-apk
          path: ZeekrBass.apk

      # Pushing a tag like v0.1.0 also publishes the APK as a (pre-)release with a direct download link.
      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ZeekrBass.apk
          prerelease: true
          generate_release_notes: true
